[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "explore-behavior"
version = "2.0.2"
description = "Automated exploration behavior analysis for object recognition tests using CLIP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Victor Ibañez", email = "victor.ibanez@uzh.ch" }]
keywords = [
    "neuroscience",
    "behavior",
    "object recognition",
    "deep learning",
    "CLIP",
    "ORT",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "open-clip-torch>=2.24",
    "opencv-python>=4.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pillow>=10.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "click>=8.1",
    "joblib>=1.3",
    "nicegui>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
    "types-tqdm>=4.66",
    "types-seaborn>=0.13",
]
docs = [
    "sphinx>=7.3",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.1",
    "myst-parser>=3.0",
]

[project.urls]
Homepage = "https://github.com/victorjonathanibanez/EXPLORE"
Repository = "https://github.com/victorjonathanibanez/EXPLORE"
Documentation = "https://explore.readthedocs.io"
"Bug Tracker" = "https://github.com/victorjonathanibanez/EXPLORE/issues"

[project.scripts]
explore = "explore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"explore.assets" = ["*.png", "*.svg", "*.ico"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# GUI and CLI files use tkinter/NiceGUI kwargs patterns and third-party
# stubs that don't support strict type-checking cleanly.
module = [
    "explore.cli",
    "explore.gui.nicegui_app",
    "explore.gui.behavior_setup",
    "explore.gui.object_setup",
    "explore.gui.review",
]
ignore_errors = true

[[tool.mypy.overrides]]
# transformers is not installed in the CI lint step (too large), so
# AutoProcessor is Any there and no-untyped-call ignores are stale.
# pandas reset_index() return type differs between mypy stub versions.
module = [
    "explore.detection.object_detector",
    "explore.pipeline.analysis",
]
warn_unused_ignores = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=explore --cov-report=term-missing --cov-report=xml -q"
markers = [
    "slow: marks tests as slow — skip with '-m \"not slow\"'",
    "gpu: marks tests that require a CUDA device",
    "integration: marks end-to-end integration tests",
]

[tool.coverage.run]
source = ["src/explore"]
omit = ["*/gui/*", "*/cli.py"]   # GUI and CLI covered by integration tests

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
